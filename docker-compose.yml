services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: commentators
      POSTGRES_USER: commentators
      POSTGRES_PASSWORD: commentators
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
    environment:
      DB_URL: jdbc:postgresql://db:5432/commentators
      DB_USER: commentators
      DB_PASSWORD: commentators
      DB_PROFILE_TABLE: user_profiles_enriched
    ports:
      - "8080:8080"

volumes:
  postgres_data:
